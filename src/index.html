<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MossImage Layout Editor</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div><div class="eyebrow">MOSS-IMAGE</div><h1>Create Bounding Boxes</h1></div>
    <div class="controls">
      <label><span data-t="width"></span><input id="width" type="number" min="64" max="16384" step="16" value="1024" required></label>
      <label><span data-t="height"></span><input id="height" type="number" min="64" max="16384" step="16" value="1024" required></label>
      <button id="open" data-t="open"></button>
      <button id="save" data-t="save"></button>
      <select id="language" aria-label="Language / 言語"><option value="en">English</option><option value="ja">日本語</option></select>
    </div>
  </header>
  <main>
    <div id="editor"></div>
    <aside>
      <h2 data-t="heading"></h2>
      <label for="caption" data-t="caption"></label>
      <textarea id="caption" rows="4"></textarea>
      <label for="characters" data-t="characters"></label>
      <input id="characters" type="text" placeholder="1, 3" autocomplete="off">
      <p class="muted" data-t="characterHelp"></p>
      <div class="output-header"><label for="prompt" data-t="prompt"></label><span class="muted" id="count"></span></div>
      <textarea id="prompt" readonly spellcheck="false" wrap="off"></textarea>
      <div class="actions"><button id="copy" class="primary" data-t="copy"></button><button id="export" data-t="export"></button></div>
      <p id="status" class="muted" role="status"></p>
    </aside>
  </main>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
